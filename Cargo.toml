[package]
name = "r2warp"
version = "0.1.0"
edition = "2021"
authors = ["Abhi <abhi@revengi.in>"]
description = "WARP signature format support for radare2"

[lib]
name = "r2warp"
crate-type = ["cdylib"]

[dependencies]
uuid = { version = "1.17.0", features = ["v5", "serde"] }
flatbuffers = "25.2.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ureq = { version = "=2.9.7", features = ["json", "tls"] }
sha1 = "0.10"
memmap2 = "0.9"
flate2 = "1.1"
warp = { git = "https://github.com/Vector35/warp", rev = "1.0.1" }



[profile.release]
opt-level = 3
lto = true
